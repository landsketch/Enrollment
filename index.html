<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Enrollment System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Enrollment System</h1>
            <p>Please fill out the form below to enroll.</p>
        </header>

        <form id="enrollmentForm">

            <!-- Student ID -->
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter Student ID"
                    minlength="5"
                    required
                >
                <small class="error" id="studentIdError"></small>
            </div>

            <!-- Prefix -->
            <div class="form-group">
                <label for="prefix">Prefix</label>
                <input
                    type="text"
                    id="prefix"
                    name="prefix"
                    placeholder="e.g. Mr., Ms., Dr."
                    minlength="2"
                >
                <small class="error" id="prefixError"></small>
            </div>

            <!-- First Name -->
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter First Name"
                    minlength="3"
                    required
                >
                <small class="error" id="firstNameError"></small>
            </div>

            <!-- Middle Name -->
            <div class="form-group">
                <label for="middleName">Middle Name</label>
                <input
                    type="text"
                    id="middleName"
                    name="middleName"
                    placeholder="Enter Middle Name"
                    minlength="2"
                >
                <small class="error" id="middleNameError"></small>
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter Last Name"
                    minlength="2"
                    required
                >
                <small class="error" id="lastNameError"></small>
            </div>

            <!-- Suffix -->
            <div class="form-group">
                <label for="suffix">Suffix</label>
                <input
                    type="text"
                    id="suffix"
                    name="suffix"
                    placeholder="e.g. Jr., Sr., III"
                    minlength="2"
                >
                <small class="error" id="suffixError"></small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
                <small class="error" id="emailError"></small>
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                    <option value="BMMA">BMMA</option>
                    <option value="BSAIS">BSAIS</option>
                </select>

                <small class="error" id="courseError"></small>
            </div>

            <!-- Major -->
            <div class="form-group" id="majorGroup">
                <label for="major">Major</label>

                <select id="major" name="major">
                    <option value="">-- Select Major --</option>
                    <option value="Net Sec">Network Security</option>
                    <option value="Web Tech">Web Technology</option>
                    <option value="ERP">Enterprise Resource Planning</option>
                </select>

                <small class="error" id="majorError"></small>
            </div>

            <!-- Year Level -->
            <div class="form-group">
                <label for="yearLevel">Year Level</label>

                <select id="yearLevel" name="yearLevel" required>
                    <option value="">-- Select Year Level --</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                </select>

                <small class="error" id="yearLevelError"></small>
            </div>

            <button type="submit">Submit Enrollment</button>

        </form>

        <!-- Success Message -->
        <div id="successMessage" class="success"></div>

        <!-- Submitted Data -->
        <section id="resultSection">

            <h2>Submitted Enrollment Data</h2>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Major</th>
                            <th>Year Level</th>
                        </tr>
                    </thead>

                    <tbody id="resultTableBody">
                    </tbody>

                </table>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
